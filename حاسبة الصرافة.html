<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة الصرافة التبادلية</title>
    <style>
        :root { --primary: #00d1b2; --bg: #121212; --card: #1e1e1e; --text: #e0e0e0; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { background: var(--card); padding: 20px; border-radius: 15px; width: 100%; max-width: 450px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #aaa; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; text-align: center; font-size: 1.1rem; }
        input:focus { border-color: var(--primary); outline: none; }
        .highlight-input { border: 1px solid var(--primary); background: #1a3a3a; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; background: #252525; border: 1px dashed var(--primary); }
        .profit-val { font-size: 1.6rem; font-weight: bold; text-align: center; color: var(--primary); margin: 5px 0; }
        .info { font-size: 0.85rem; display: flex; justify-content: space-between; margin-bottom: 5px; }
        .status { text-align: center; padding: 5px; border-radius: 5px; font-weight: bold; font-size: 0.8rem; }
        .good { color: #23d160; } .warning { color: #ffdd57; } .danger { color: #ff3860; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--primary)">حاسبة الصرافة الذكية 💱</h2>
    
    <div class="grid">
        <div>
            <label>سعر شراء USDT (بالريال)</label>
            <input type="number" id="myUsdtCost" value="0.389" step="0.001" oninput="calculate('egp')">
        </div>
        <div>
            <label>سعر USDT/جنيه (سوق)</label>
            <input type="number" id="marketRate" value="48.31" step="0.01" oninput="calculate('egp')">
        </div>
    </div>

    <div style="background:#2a2a2a; padding:15px; border-radius:10px; margin-bottom:15px;">
        <label style="color:var(--primary); font-weight:bold;">سعر الاتفاق (كم جنيه مقابل 1 ريال؟)</label>
        <input type="number" id="customerRate" value="122" step="0.1" oninput="calculate('egp')">
    </div>

    <div class="grid" style="background:#1a1a1a; padding:10px; border-radius:10px; border:1px solid #444;">
        <div>
            <label>المبلغ بالريال (من الزبون)</label>
            <input type="number" id="omrAmount" placeholder="0.000" class="highlight-input" oninput="calculate('omr')">
        </div>
        <div>
            <label>المبلغ بالجنيه (لمصر)</label>
            <input type="number" id="egpAmount" placeholder="0" class="highlight-input" oninput="calculate('egp')">
        </div>
    </div>

    <div class="input-group" style="margin-top:10px">
        <label>عمولة الوسيط (بالريال)</label>
        <input type="number" id="brokerFee" value="0.5" step="0.1" oninput="calculate('egp')">
    </div>

    <div class="result-box">
        <div class="info"><span>تكلفة التحويل عليك:</span> <span id="actualCost" style="color:#ffd700">0.000</span></div>
        <div style="text-align:center; font-size:0.8rem; margin-top:10px">صافي ربحك النهائي</div>
        <div id="profitResult" class="profit-val">0.000 ريال</div>
        <div id="statusBadge" class="status">--</div>
    </div>
</div>

<script>
    function calculate(source) {
        const myUsdtCost = parseFloat(document.getElementById('myUsdtCost').value) || 0;
        const marketRate = parseFloat(document.getElementById('marketRate').value) || 0;
        const customerRate = parseFloat(document.getElementById('customerRate').value) || 0;
        const brokerFee = parseFloat(document.getElementById('brokerFee').value) || 0;
        
        let egpAmount = parseFloat(document.getElementById('egpAmount').value) || 0;
        let omrAmount = parseFloat(document.getElementById('omrAmount').value) || 0;

        if (source === 'omr') {
            // لو كتبت بالريال، يحسب الجنيه تلقائياً (مثال: 100 ريال * 122 = 12200 جنيه)
            egpAmount = omrAmount * customerRate;
            document.getElementById('egpAmount').value = egpAmount.toFixed(0);
        } else if (source === 'egp') {
            // لو كتبت بالجنيه، يحسب الريال تلقائياً
            omrAmount = egpAmount / customerRate;
            document.getElementById('omrAmount').value = omrAmount.toFixed(3);
        }

        // حسابات التكلفة والربح
        const usdtNeeded = egpAmount / marketRate;
        const totalCostInOmr = usdtNeeded * myUsdtCost;
        const netProfit = omrAmount - totalCostInOmr - brokerFee;

        // العرض
        document.getElementById('actualCost').innerText = totalCostInOmr.toFixed(3) + " OMR";
        document.getElementById('profitResult').innerText = netProfit.toFixed(3) + " ريال";

        const badge = document.getElementById('statusBadge');
        if (netProfit > 1) { badge.innerText = "ربح ممتاز ✅"; badge.className = "status good"; }
        else if (netProfit > 0) { badge.innerText = "ربح مقبول 👍"; badge.className = "status warning"; }
        else { badge.innerText = "خسارة! راجع الأسعار ❌"; badge.className = "status danger"; }
    }
</script>

</body>
</html>
